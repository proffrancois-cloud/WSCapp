<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Refreshing WSC App</title>
    <meta name="robots" content="noindex" />
    <style>
      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        background: #f6ecd0;
        color: #4c2f1f;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      main {
        width: min(520px, calc(100vw - 32px));
        padding: 28px;
        border: 2px solid #c9ab73;
        border-radius: 18px;
        background: #fff8e8;
        box-shadow: 0 18px 40px rgba(76, 47, 31, 0.16);
      }

      h1 {
        margin: 0 0 12px;
        font-size: 1.5rem;
      }

      p {
        margin: 0;
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Refreshing the app...</h1>
      <p id="status">Clearing old browser caches and loading the newest GitHub Pages build.</p>
    </main>
    <script>
      (async () => {
        const status = document.getElementById("status");
        const appUrl = new URL("./", window.location.href);
        appUrl.searchParams.set("fresh", String(Date.now()));

        try {
          if ("serviceWorker" in navigator && typeof navigator.serviceWorker.getRegistrations === "function") {
            const registrations = await navigator.serviceWorker.getRegistrations();
            await Promise.all(
              registrations
                .filter((registration) => registration.scope.startsWith(new URL("./", window.location.href).href))
                .map((registration) => registration.unregister())
            );
          }

          if ("caches" in window) {
            const keys = await window.caches.keys();
            await Promise.all(
              keys
                .filter((key) => typeof key === "string" && key.startsWith("wsc-routes-"))
                .map((key) => window.caches.delete(key))
            );
          }

          try {
            window.localStorage.removeItem("wsc-pwa-reset-version");
            window.localStorage.removeItem("wsc-service-worker-retired-version");
            window.sessionStorage.removeItem("wsc-service-worker-retire-reload");
          } catch (_error) {}

          status.textContent = "Done. Opening the fresh app now...";
        } catch (_error) {
          status.textContent = "Opening the fresh app now...";
        }

        window.setTimeout(() => {
          window.location.replace(appUrl.href);
        }, 350);
      })();
    </script>
  </body>
</html>
